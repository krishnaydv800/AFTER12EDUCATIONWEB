
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Assistant</title>

    <link rel="stylesheet" href="ai.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <header class="chat-header">

            <div class="bot-info">
                <div class="bot-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div>
                    <h2>AI Assistant</h2>
                    <span>
                        <i class="online-dot"></i>
                        Online
                    </span>
                </div>
            </div>

            <button id="clearChat" class="clear-btn" title="Clear Chat">
                <i class="fa-solid fa-trash"></i>
            </button>

        </header>


        <!-- Chat Area -->
        <main class="chat-box" id="chatBox">

            <div class="welcome-message">

                <div class="welcome-icon">
                    <i class="fa-solid fa-user"></i>
                </div>

                <h1>Hello! 👋</h1>

                <p>
                    I'm your AI Assistant. How can I help you today?
                </p>

                <div class="quick-buttons">

                    <button onclick="quickMessage('Tell me about B.Tech')">
                        🎓 B.Tech
                    </button>

                    <button onclick="quickMessage('What is BCA?')">
                        💻 BCA
                    </button>

                    <button onclick="quickMessage('Give me career advice')">
                        💼 Career
                    </button>

                    <button onclick="quickMessage('What should I do after 12th?')">
                        📚 After 12th
                    </button>
                    

                </div>

            </div>

        </main>


        <!-- Typing Indicator -->
        <div class="typing" id="typing">

            <span></span>
            <span></span>
            <span></span>

            <small>AI is typing...</small>

        </div>


        <!-- Input Area -->
        <footer class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Ask me anything..."
                autocomplete="off"
            >

            <button id="sendBtn">
                ➤
            </button>

        </footer>

    </div>


    <script src="ai.js"></script>

</body>
</html>
